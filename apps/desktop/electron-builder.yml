# Installers: `pnpm -C apps/desktop dist` on each system builds that system's own.
appId: app.fineframe.desktop
productName: Fineframe
# The installed folder's name on Windows (Programs\fineframe), rather than the package's.
extraMetadata:
  name: fineframe
copyright: Copyright © zcxy-dev
directories:
  output: dist
  buildResources: assets
files:
  - package.json
  - src/**/*.ts
  - "!src/**/*.test.ts"
  - assets/icons/512x512.png
# From build/ itself: electron-builder leaves out the node_modules at the top of a folder it
# copies, which editor/'s are.
extraResources:
  - from: build
    to: .
    filter: ["editor/**/*", "bin/**/*"]
artifactName: Fineframe-${version}-${os}-${arch}.${ext}
publish: null
mac:
  target: dmg
  category: public.app-category.video
  # Signed ad hoc, which Apple silicon needs to run it at all; not with a Developer ID yet, so
  # the first launch needs "Open Anyway" (README).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
win:
  target: nsis
nsis:
  # Installed for the user alone, needing no administrator, and opened when installed.
  oneClick: true
  perMachine: false
  runAfterFinish: true
linux:
  target: AppImage
  executableName: fineframe
  category: AudioVideo
  synopsis: A fully automatic video editor
