[project]
name = "vework"
version = "0.4.0"
description = "Analysis worker for automatic video editing: probe, shot transitions, speech, timed transcripts, loudness, audio events, faces and who speaks"
readme = "README.md"
license = "LicenseRef-Proprietary"
keywords = ["video-editing", "asr", "forced-alignment", "shot-detection", "vad"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
authors = [
    { name = "Jason Chang" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "av>=19.0.1",
    "numpy>=2.5.4",
    "opencc>=1.4.2",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
]

[project.urls]
Repository = "https://github.com/zcxy-dev/fineframe"
Issues = "https://github.com/zcxy-dev/fineframe/issues"

[project.scripts]
vework = "vework.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# Linux installs the CPU-only torch build; a CUDA machine needs to pick its own.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# beat_this needs torchaudio only for its file loader and mel front end, which vework replaces
# (beats.py); no torchaudio release matches torch 2.14, so it is left out.
override-dependencies = ["torchaudio; sys_platform == 'never'"]
default-groups = ["dev", "ml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
# Tests only: they check that the correction guard counts words the way vebench scores them.
vebench = { path = "../bench", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated: their descriptions come from the schemas as single long strings.
"src/vework/media_index.py" = ["E501"]
"src/vework/music_index.py" = ["E501"]

[tool.pytest.ini_options]
# Each test's tmp_path is removed when the run ends, failed or not.
tmp_path_retention_policy = "none"
markers = [
    "ml: needs the ml group and downloads model weights",
    "big: loads the speech model, too big for CI",
    "claude: calls the Claude API; runs only when ANTHROPIC_API_KEY is set",
]

[dependency-groups]
# The models' packages. A default group, so `uv sync` and `uv run` install it; CI's quick checks
# leave it out with `--no-group ml`.
ml = [
    "beat-this>=1.1.0",
    "huggingface-hub>=2.2.0",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "silero-vad>=6.2.3",
    "torch>=2.14.1",
    "transformers>=5.20.0",
    "transnetv2-pytorch>=1.0.5",
]
dev = [
    "datamodel-code-generator>=0.83.0",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "vebench",
]
