name: owner-ok

# A pull request that changes what people outside the team see merges only after
# the owner looked at its preview and screenshots and added the `owner-ok` label.
# The label covers the commit it was added on: a new commit removes it. An
# automatic revert opened by a deploy check is exempt once its one commit is shown
# to be exactly the revert of a commit on main. The ruleset requires this check.
# Shared by every app with outside viewers (dotfiles github/templates); what they
# see is the repository's variables, declared in dotfiles github/repo-settings.json:
#   OWNER_OK_PATHS   an ERE of the changed paths that need the OK (required)
#   OWNER_OK_IGNORE  an ERE of paths among those that do not (optional)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: owner-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-ok:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      # Removes a stale owner-ok label.
      pull-requests: write
    steps:
      # Read only by git, to check an automatic revert; no repository code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the owner's OK for a visible change
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VISIBLE_PATHS: ${{ vars.OWNER_OK_PATHS }}
          IGNORE_PATHS: ${{ vars.OWNER_OK_IGNORE }}
        run: |
          # Without the variable every change would pass unseen.
          [ -n "$VISIBLE_PATHS" ] || { echo "::error::The repository variable OWNER_OK_PATHS is not set."; exit 1; }
          pr="$(gh pr view "$PR" --json author,headRefName,headRefOid,labels)"
          author="$(jq -r .author.login <<<"$pr")"
          head_ref="$(jq -r .headRefName <<<"$pr")"
          # A run decides only for the pull request head it checks.
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "::error::Pull request $PR's head is not $HEAD_SHA."; exit 1
          fi
          # A new commit (pushed by a person or a workflow) needs a new OK.
          if [ "$ACTION" = synchronize ]; then
            if jq -e '.labels | any(.name == "owner-ok")' <<<"$pr" >/dev/null; then
              gh pr edit "$PR" --remove-label owner-ok
              pr="$(jq '.labels |= map(select(.name != "owner-ok"))' <<<"$pr")"
            fi
          fi
          if [ "$author" = 'app/github-actions' ] && [[ "$head_ref" == auto-revert/* ]]; then
            reverted="$(git log -1 --format=%B "$HEAD_SHA" | sed -n 's/^This reverts commit \([0-9a-f]\{40\}\)\..*/\1/p')"
            if [ "$(git rev-list --count "origin/main..$HEAD_SHA")" = 1 ] && [ -n "$reverted" ] \
              && git merge-base --is-ancestor "$reverted" origin/main \
              && [ "$(git diff "$reverted" "$reverted^" | git patch-id --verbatim | cut -d' ' -f1)" \
                = "$(git diff "$HEAD_SHA^" "$HEAD_SHA" | git patch-id --verbatim | cut -d' ' -f1)" ]; then
              echo "Automatic revert of $reverted: no OK needed." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "::error::$head_ref is not exactly one commit reverting a commit on main."; exit 1
          fi
          # From the checkout, which a pull request of any size lists in full; a failure fails the check.
          base="$(git merge-base origin/main "$HEAD_SHA")"
          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          visible="$(grep -E "$VISIBLE_PATHS" <<<"$files" || true)"
          if [ -n "$IGNORE_PATHS" ]; then visible="$(grep -vE "$IGNORE_PATHS" <<<"$visible" || true)"; fi
          if [ -z "$visible" ]; then
            echo "No visible change." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          printf 'Visible change:\n%s\n' "$visible" >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.labels | any(.name == "owner-ok")' <<<"$pr" >/dev/null; then
            echo "The owner's OK is recorded (owner-ok label)." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "::error::This pull request changes what people see; it merges after the owner adds the owner-ok label."
          exit 1
