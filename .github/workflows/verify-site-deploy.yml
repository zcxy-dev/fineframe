name: verify-site-deploy

# Fails when Cloudflare Pages does not deploy a main commit that changes apps/site/, or when
# fineframe.app then does not serve it (its /version.json) or does not answer; the failed run is
# the alert. Pages reports the deploy only as a `Cloudflare Pages` check run on the commit, created
# when the build finishes (no commit status, no GitHub Deployment). When Pages deployed but the site
# does not serve the commit or does not answer, the revert job reverts
# the commit through a pull request that runs its checks and merges itself, and Pages deploys the
# previous site again; a failed Pages build leaves the previous site serving.
# A rollback drill runs the revert by hand for main's newest commit
# (`gh workflow run verify-site-deploy.yml -f drill_sha=<sha>`), without breaking the site.
on:
  push:
    branches: [main]
    paths: [apps/site/**]
  workflow_dispatch:
    inputs:
      drill_sha:
        description: Main's newest commit, to revert as if the site had failed on it
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.live.outputs.outcome }}
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for the Cloudflare Pages check run
        # Builds take about two minutes; a check run that never completes is a failure too, unless
        # the site already serves the commit.
        run: |
          deadline=$((SECONDS + 20 * 60))
          while :; do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Cloudflare%20Pages&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")] | first // empty | "\(.status) \(.conclusion) \(.details_url)"')
            read -r status conclusion url <<< "$run"
            if [ "$status" = completed ]; then
              echo "Cloudflare Pages: $conclusion ($url)"
              [ "$conclusion" = success ] && exit 0
              echo "::error::The Cloudflare Pages deploy of $SHA did not succeed: $conclusion"
              exit 1
            fi
            # Pages builds one commit at a time and leaves a superseded build's check run in
            # progress: a site already serving this commit or a newer one built on it deployed it.
            served="$(curl -fsS --max-time 15 "https://fineframe.app/version.json?run=$GITHUB_RUN_ID" | jq -r '.commit // empty' || true)"
            if [ -n "$served" ] && { [ "$served" = "$SHA" ] \
              || [ "$(gh api "repos/$REPO/compare/$SHA...$served" --jq .status 2>/dev/null)" = ahead ]; }; then
              echo "fineframe.app serves $served, which includes $SHA"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No completed Cloudflare Pages check run on $SHA after 20 minutes"
              exit 1
            fi
            sleep 20
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
      # Pages reports success once the files are uploaded; fineframe.app must then serve this
      # commit (or a newer one built on it), read from the version.json the build writes.
      - name: Check that fineframe.app serves the commit
        id: live
        run: |
          for _ in $(seq 20); do
            served="$(curl -fsS --max-time 15 "https://fineframe.app/version.json?run=$GITHUB_RUN_ID" | jq -r '.commit // empty' || true)"
            if [ "$served" = "$SHA" ] || { [ -n "$served" ] \
              && [ "$(gh api "repos/$REPO/compare/$SHA...$served" --jq .status 2>/dev/null)" = ahead ]; } \
              && curl -fsS --max-time 15 -o "$RUNNER_TEMP/en.html" https://fineframe.app/en/ \
              && grep -q 'Fineframe' "$RUNNER_TEMP/en.html"; then
              echo "fineframe.app serves $served"
              echo "outcome=verified" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "::error::fineframe.app serves ${served:-no version.json}, not $SHA, after its deploy"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

  revert:
    needs: verify
    if: >-
      always() && (needs.verify.outputs.outcome == 'failed'
        || (github.event_name == 'workflow_dispatch' && inputs.drill_sha != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      # Approves the runs of the pull request it opens, which wait for an approval.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Pushes the revert branch.
          persist-credentials: true # zizmor: ignore[artipacked]
      # Only main's newest commit is reverted, never an automatic revert and never a
      # commit with a No-Auto-Rollback trailer: anything else (a redeploy of an older
      # commit, a failed revert, a change older releases cannot run against) waits
      # for a person, so two runs can never revert each other.
      - name: Refuse anything but main's newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.drill_sha || github.sha }}
        run: |
          branch="$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[0].head.ref // ""')"
          if [ "$(git rev-parse HEAD)" != "$SHA" ] || [[ "$branch" == auto-revert/* ]] \
            || git log -1 --format=%B "$SHA" | grep -qi '^No-Auto-Rollback:'; then
            echo "::error::$SHA is not main's newest commit, is an automatic revert or has a No-Auto-Rollback trailer; nothing was reverted."
            exit 1
          fi
      - name: Open the revert, run its required checks and merge it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ inputs.drill_sha || github.sha }}
        run: |
          branch="auto-revert/${SHA:0:12}"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            revert --no-edit "$SHA"
          # The revert must give back exactly the tree main had before the commit.
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$SHA^^{tree}")"
          head="$(git rev-parse HEAD)"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "Revert $(git log -1 --format=%s "$SHA")" \
            --body "verify-site-deploy ($GITHUB_EVENT_NAME) reverts $SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Merging this revert makes Cloudflare Pages deploy the previous site.")"
          # Runs started by a pull request opened with the workflow token wait for an
          # approval: approve each as it appears, until every check main's ruleset
          # requires has started on the revert, then wait for them to pass.
          required="$(gh api "repos/$GH_REPO/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')"
          missing="$required"
          for _ in $(seq 40); do
            sleep 6
            for id in $(gh api "repos/$GH_REPO/actions/runs?branch=$branch&event=pull_request" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id'); do
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null
            done
            started="$(gh api "repos/$GH_REPO/commits/$head/check-runs?per_page=100" --jq '.check_runs[].name')"
            missing="$(grep -vxF -f <(printf '%s\n' "$started") <<<"$required" || true)"
            [ -z "$missing" ] && break
          done
          [ -z "$missing" ] || { echo "::error::$(paste -sd ' ' - <<<"$missing") did not start on $branch."; exit 1; }
          gh pr checks "$pr_url" --required --watch --fail-fast --interval 15
          # Merge only the checked commit, and only while the reverted commit is
          # still main's newest: on a newer main the result would be untested.
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$SHA" ]; then
            echo "::error::main moved past $SHA while the revert was checked; $pr_url waits for a person."; exit 1
          fi
          gh pr merge "$pr_url" --squash --match-head-commit "$head"
          # A merge made with the workflow token starts no ci on main.
          gh workflow run ci.yml --ref main
