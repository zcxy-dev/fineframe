name: probe

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Probe
        working-directory: worker
        run: |
          sysctl -n machdep.cpu.brand_string; sw_vers
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg" https://raw.githubusercontent.com/imageio/imageio-binaries/f8f64710ea88e7e4a352c0f7d8c0deac9f5fd685/ffmpeg/ffmpeg-macos-aarch64-v7.1
          chmod +x "$RUNNER_TEMP/ffmpeg"; F="$RUNNER_TEMP/ffmpeg"
          "$F" -hide_banner -hwaccels
          "$F" -hide_banner -v error -f lavfi -i testsrc2=s=640x360:r=30000/1001:d=3 -c:v libx264 -pix_fmt yuv420p -bf 2 "$RUNNER_TEMP/clip.mp4"
          "$F" -hide_banner -v verbose -hwaccel videotoolbox -i "$RUNNER_TEMP/clip.mp4" -pix_fmt yuv420p -f framemd5 "$RUNNER_TEMP/hw.md5" 2>&1 | grep -i -E "videotoolbox|hwaccel|error" | head -20 || true
          "$F" -hide_banner -v error -i "$RUNNER_TEMP/clip.mp4" -pix_fmt yuv420p -f framemd5 "$RUNNER_TEMP/sw.md5"
          diff "$RUNNER_TEMP/hw.md5" "$RUNNER_TEMP/sw.md5" && echo "CLI framemd5 identical" || echo "CLI framemd5 differ"
          uv sync --locked
          uv run python - "$RUNNER_TEMP/clip.mp4" <<'PY'
          import sys, av, av.codec.hwaccel as h, torch, onnxruntime
          print("torch", torch.__version__, "mps built", torch.backends.mps.is_built(), "mps available", torch.backends.mps.is_available())
          if torch.backends.mps.is_available():
              x = torch.randn(256, 256, device="mps"); print("mps matmul", float((x @ x).sum().cpu()))
          print("ort", onnxruntime.get_available_providers())
          print("pyav", av.__version__, h.hwdevices_available())
          def frames(accel):
              with av.open(sys.argv[1], hwaccel=accel) as c:
                  s = c.streams.video[0]
                  out = [(f.pts, f.format.name, f.width, f.height, f.reformat(format="yuv420p").to_ndarray(), f.to_ndarray(format="rgb24"), f.to_ndarray(width=48, height=27, format="rgb24"), f.time) for f in c.decode(s)]
                  print("is_hwaccel", s.codec_context.is_hwaccel)
                  return out
          sw = frames(None)
          try:
              hw = frames(h.HWAccel("videotoolbox", allow_software_fallback=False))
              print("frames", len(sw), len(hw), "pts equal", [f[0] for f in sw] == [f[0] for f in hw], "formats", sw[0][1], hw[0][1], "yuv equal", all((a[4] == b[4]).all() for a, b in zip(sw, hw)), "rgb maxdiff", max(int(abs(a[5].astype(int) - b[5]).max()) for a, b in zip(sw, hw)), "thumb maxdiff", max(int(abs(a[6].astype(int) - b[6]).max()) for a, b in zip(sw, hw)), "times equal", [f[7] for f in sw] == [f[7] for f in hw])
          except Exception as e:
              print("pyav videotoolbox failed:", repr(e))
          PY
