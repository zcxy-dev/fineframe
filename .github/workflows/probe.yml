name: probe

on:
  pull_request:

permissions: {}

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Probe
        working-directory: worker
        run: |
          sysctl -n machdep.cpu.brand_string; sw_vers
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg" https://raw.githubusercontent.com/imageio/imageio-binaries/f8f64710ea88e7e4a352c0f7d8c0deac9f5fd685/ffmpeg/ffmpeg-macos-aarch64-v7.1
          chmod +x "$RUNNER_TEMP/ffmpeg"; F="$RUNNER_TEMP/ffmpeg"
          "$F" -hide_banner -hwaccels
          "$F" -hide_banner -v error -f lavfi -i testsrc2=s=640x360:r=30000/1001:d=3 -c:v libx264 -pix_fmt yuv420p -bf 2 "$RUNNER_TEMP/clip.mp4"
          "$F" -hide_banner -v verbose -hwaccel videotoolbox -i "$RUNNER_TEMP/clip.mp4" -pix_fmt yuv420p -f framemd5 "$RUNNER_TEMP/hw.md5" 2>&1 | grep -i -E "videotoolbox|hwaccel|error" | head -20 || true
          "$F" -hide_banner -v error -i "$RUNNER_TEMP/clip.mp4" -pix_fmt yuv420p -f framemd5 "$RUNNER_TEMP/sw.md5"
          diff "$RUNNER_TEMP/hw.md5" "$RUNNER_TEMP/sw.md5" && echo "CLI framemd5 identical" || echo "CLI framemd5 differ"
          uv sync --locked
          "$F" -hide_banner -v error -f lavfi -i testsrc2=s=640x360:r=30:d=3 -c:v libx264 -pix_fmt yuv420p -bf 0 "$RUNNER_TEMP/nob.mp4"
          "$F" -hide_banner -v error -f lavfi -i testsrc2=s=640x352:r=30:d=3 -c:v libx264 -pix_fmt yuv420p -bf 2 "$RUNNER_TEMP/m16.mp4"
          "$F" -hide_banner -v error -f lavfi -i testsrc2=s=640x360:r=30:d=3 -c:v libx265 -pix_fmt yuv420p "$RUNNER_TEMP/hevc.mp4"
          uv run python - "$RUNNER_TEMP" <<'PY'
          import sys, av, av.codec.hwaccel as h, numpy as np
          def plane(f, i, w, h_):
              p = f.planes[i]
              return np.frombuffer(bytes(p), np.uint8).reshape(-1, p.line_size)[:h_, :w].astype(int)
          def raw(path, accel):
              with av.open(path, hwaccel=accel) as c:
                  out = []
                  for f in c.decode(c.streams.video[0]):
                      w, ht = f.width, f.height
                      if f.format.name == "nv12":
                          uv = plane(f, 1, w, ht // 2)
                          out.append((plane(f, 0, w, ht), uv[:, 0::2], uv[:, 1::2], f.reformat(format="yuv420p")))
                      else:
                          out.append((plane(f, 0, w, ht), plane(f, 1, w // 2, ht // 2), plane(f, 2, w // 2, ht // 2), f))
                  return out
          for name in ["clip", "hevc"]:
              path = f"{sys.argv[1]}/{name}.mp4"
              sw = raw(path, None)
              hw = raw(path, h.HWAccel("videotoolbox", allow_software_fallback=False))
              for i in [0, 10]:
                  print(name, i, "raw Y max", np.abs(sw[i][0] - hw[i][0]).max(), "raw U max", np.abs(sw[i][1] - hw[i][1]).max(), "raw V max", np.abs(sw[i][2] - hw[i][2]).max())
                  conv = hw[i][3]
                  print("   converted U max", np.abs(sw[i][1] - plane(conv, 1, conv.width // 2, conv.height // 2)).max(), "converted V max", np.abs(sw[i][2] - plane(conv, 2, conv.width // 2, conv.height // 2)).max())
          PY
