name: ffmpeg-macos-x64

# Builds the FFmpeg the renderer pins for Intel Macs (packages/engine/scripts/
# build-ffmpeg-macos-x64.sh) and tests the engine with it. A pull request that changes the build
# only builds and tests; run by hand on main, it also publishes the build as a release, which
# the renderer then pins by URL and SHA-256.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/ffmpeg-macos-x64.yml
      - packages/engine/scripts/build-ffmpeg-macos-x64.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: ffmpeg-macos-x64-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release a run on main publishes; bump it with the FFmpeg version or any source.
  RELEASE: ffmpeg-7.1.5-macos-x86_64

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install autoconf, automake and libtool
        run: brew install autoconf automake libtool
      - name: Build FFmpeg
        run: packages/engine/scripts/build-ffmpeg-macos-x64.sh "$RUNNER_TEMP/build"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Test the engine with it
        run: |
          pnpm install --frozen-lockfile
          VIDEO_EDITOR_FFMPEG="$RUNNER_TEMP/build/ffmpeg" pnpm --filter @video-editor/engine test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RELEASE }}
          path: ${{ runner.temp }}/build/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE }}
          path: build
      # Fails if the release exists: a published build is never replaced.
      - name: Publish the release
        run: |
          gh release create "$RELEASE" build/ffmpeg build/sources.tar.gz build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "FFmpeg 7.1.5 for Intel macOS" \
            --notes "Static FFmpeg for Intel Macs (macOS 11 or later), GPL-2.0-or-later, built by packages/engine/scripts/build-ffmpeg-macos-x64.sh at this tag. sources.tar.gz holds every source it was built from."
        env:
          GH_TOKEN: ${{ github.token }}
