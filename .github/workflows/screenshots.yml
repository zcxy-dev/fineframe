name: screenshots

# Re-records the screenshot baselines for a branch in the browser job's Playwright
# image and uploads them as the `screenshot-baselines` artifact. `mise run
# screenshots:update` starts it, downloads the artifact and commits the baselines,
# so the push is a person's: a commit pushed by a workflow starts no checks.
# Shared by every app (dotfiles github/templates); a repository's differences are
# its own:
#   mise run screenshots:record  sets up and records the baselines in the image ci.yml
#                                compares them in
#   SCREENSHOT_DIR               where the baselines are (a variable declared in
#                                dotfiles github/repo-settings.json)
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: screenshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Record the screenshot baselines
        env:
          SCREENSHOT_DIR: ${{ vars.SCREENSHOT_DIR }}
        run: |
          [ -n "$SCREENSHOT_DIR" ] || { echo "::error::The repository variable SCREENSHOT_DIR is not set."; exit 1; }
          mise run screenshots:record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines
          path: ${{ vars.SCREENSHOT_DIR }}
          if-no-files-found: error
          retention-days: 7
