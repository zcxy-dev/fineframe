name: desktop

# Builds the desktop app's installers on each system they are for, then runs each built app as
# a person would the first time (apps/desktop/scripts/smoke.ts): it installs the analysis, makes
# an edit of a synthetic clip with stand-ins for Claude and OpenRouter, and quits, leaving nothing
# running. Every pull request builds and checks them and links them on the pull request (the
# app's preview, AGENTS.md); a tag v<version>
# also uploads them, with copies under names without the version that the website's download page
# links to, their checksums and the update feed, to Cloudflare R2, which downloads.fineframe.app
# serves, and gets a GitHub release whose notes list the merged pull requests and link to the
# download page; the installers are not attached to it. Any other branch builds them on request
# (`gh workflow run desktop.yml --ref <branch>`).
on:
  # Every pull request builds the installers, the desktop app's preview (AGENTS.md), except one
  # that changes only Markdown or docs (the `scope` job).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but Markdown or docs.
  scope:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - id: files
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qvE '(\.md$|^docs/)' <<<"$files"; then build=true; else build=false; fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  build:
    name: ${{ matrix.name }}
    needs: scope
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.scope.outputs.build == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            installer: dmg
          - name: windows-x64
            runner: windows-latest
            installer: exe
          - name: linux-x64
            runner: ubuntu-latest
            installer: AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Node download that takes over five minutes gives up and the install runs again from a
      # mirror, as in ci.yml's `platforms` job.
      - id: mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        continue-on-error: true
        env:
          MISE_HTTP_DOWNLOAD_TIMEOUT: 5m
        with:
          cache: false
      - if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_HTTP_DOWNLOAD_TIMEOUT: 10m
          MISE_NODE_MIRROR_URL: https://cdn.npmmirror.com/binaries/node/
        with:
          cache: false
      # The smoke test speaks its clip with the system's voice: `say` on macOS, .NET's speech
      # synthesizer on Windows, espeak-ng here.
      - name: Install espeak-ng
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      # The Supabase project and OAuth client the app signs in with: public values, kept as
      # repository variables. A release cannot be built without them.
      - name: Build the installer
        env:
          FINEFRAME_SUPABASE_URL: ${{ vars.FINEFRAME_SUPABASE_URL }}
          FINEFRAME_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FINEFRAME_SUPABASE_PUBLISHABLE_KEY }}
          FINEFRAME_OAUTH_CLIENT_ID: ${{ vars.FINEFRAME_OAUTH_CLIENT_ID }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ -z "$FINEFRAME_SUPABASE_URL" ] || [ -z "$FINEFRAME_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$FINEFRAME_OAUTH_CLIENT_ID" ]; }; then
            echo "A release needs the FINEFRAME_SUPABASE_URL, FINEFRAME_SUPABASE_PUBLISHABLE_KEY and FINEFRAME_OAUTH_CLIENT_ID repository variables"
            exit 1
          fi
          # Signing the macOS app (@electron/osx-sign) opens all of its files at once to find the
          # binaries, more than the runner's default limit of open files allows at times (EMFILE).
          if [ "$RUNNER_OS" = macOS ]; then ulimit -n "$(sysctl -n kern.maxfilesperproc)"; fi
          pnpm install --frozen-lockfile
          pnpm --filter @video-editor/desktop dist
      - name: Run the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls apps/desktop/dist/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/app" "$dmg"
          node apps/desktop/scripts/smoke.ts "$RUNNER_TEMP/app/Fineframe.app/Contents/MacOS/Fineframe" \
            --shots "$RUNNER_TEMP/shots"
          hdiutil detach "$RUNNER_TEMP/app"
      # Installed silently for this user, as the installer does when opened, then run from there.
      - name: Run the built app (Windows)
        if: runner.os == 'Windows'
        run: |
          # Which CPU the runner has: the analysis crashed with an illegal instruction on some (#59).
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
          installer=$(ls apps/desktop/dist/*.exe)
          powershell -NoProfile -Command "Start-Process -Wait -FilePath '$installer' -ArgumentList '/S'"
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs"
          app=$(find "$programs" -maxdepth 3 -name 'Fineframe.exe' | head -1)
          if [ -z "$app" ]; then find "$programs" -maxdepth 3 | head -50; exit 1; fi
          app=$(cygpath -w "$app")
          echo "installed at $app"
          # The installer may open the app when it finishes; a second copy would only hand over to
          # that one and quit, so the smoke test starts from none running.
          sleep 5
          powershell -NoProfile -Command "Get-Process | Where-Object { \$_.Path -eq '$app' } | ForEach-Object { Write-Output \"stopping \$(\$_.Id)\"; Stop-Process -Id \$_.Id -Force }"
          node apps/desktop/scripts/smoke.ts "$app" --shots "$RUNNER_TEMP/shots"
      - name: Run the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1440x960x24" \
            node apps/desktop/scripts/smoke.ts apps/desktop/dist/*.AppImage --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: apps/desktop/dist/*.${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
      # What electron-updater reads beside the installer: latest*.yml, and the blockmap that
      # lets a later update download only what changed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-${{ matrix.name }}
          path: |
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14

  # The installers are the desktop app's preview: link them on the pull request.
  link:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Link the installers on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf '<!-- fineframe-installers -->\nInstallers of %s (macOS, Windows, Linux; the installer artifacts, kept 14 days): %s\n' "$SHA" "$url")"
          id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- fineframe-installers -->")) | .id][0] // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  # The one check branch protection requires of this workflow: passes when the installers built
  # and ran, or were not built for this pull request (a draft, or Markdown or docs only), and fails
  # when they, or the scope that decides, failed.
  desktop-passed:
    needs: [scope, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "scope: $SCOPE, build: $BUILD"
          for result in "$SCOPE" "$BUILD"; do
            case "$result" in failure | cancelled) exit 1 ;; esac
          done
        env:
          SCOPE: ${{ needs.scope.result }}
          BUILD: ${{ needs.build.result }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: feed-*
          path: feed
          merge-multiple: true
      # Signed build provenance for each installer, which `gh attestation verify` checks.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*
      # The tag names the app's version, so the installers' names match the tag.
      - name: Check the tag
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in apps/desktop/package.json"
            exit 1
          fi
      # The installers first, then copies under names without the version (Fineframe-mac-arm64.dmg,
      # Fineframe-win-x64.exe, Fineframe-linux-x86_64.AppImage) and SHA256SUMS of both, then the
      # latest*.yml that point the apps at the installers (apps/desktop/src/updates.ts), with R2's
      # S3 API. What a later release replaces is served with no-cache. The checksums the AWS CLI
      # adds by default are left out, as R2 asks.
      - name: Upload the installers and the update feed to Cloudflare R2
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID variable and the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET secrets are not all set"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          mkdir latest
          for file in installers/*; do
            name=${file#installers/}
            cp "$file" "latest/${name/-$version-/-}"
          done
          sums=$(cd installers && sha256sum -- *; cd ../latest && sha256sum -- *)
          echo "$sums" | tee latest/SHA256SUMS
          r2=(--endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com")
          aws s3 cp installers/ "s3://$R2_BUCKET/" --recursive "${r2[@]}"
          aws s3 cp latest/ "s3://$R2_BUCKET/" --recursive --cache-control no-cache "${r2[@]}"
          aws s3 cp feed/ "s3://$R2_BUCKET/" --recursive --exclude "latest*.yml" "${r2[@]}"
          aws s3 cp feed/ "s3://$R2_BUCKET/" --recursive --exclude "*" --include "latest*.yml" \
            --cache-control no-cache "${r2[@]}"
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # fineframe.app's download page names the version its build read from the update feed
      # (apps/site/lib/release.ts): build it again now that the feed names this one, with the
      # Pages project's deploy hook, which builds main (apps/site/DEPLOY.md).
      - name: Build fineframe.app again
        run: |
          if [ -z "$PAGES_DEPLOY_HOOK" ]; then
            echo "::error::The CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set, so fineframe.app still names the previous version"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$PAGES_DEPLOY_HOOK" > /dev/null
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      # The failed run is the alert when the rebuilt page still names an older version.
      - name: Check that the download page names this version
        run: |
          version="${TAG#v}"
          for _ in $(seq 40); do
            if curl -fsS --max-time 15 "https://fineframe.app/en/download/?run=$GITHUB_RUN_ID" | grep -qF "Version $version,"; then
              echo "https://fineframe.app/en/download/ names $version"; exit 0
            fi
            sleep 15
          done
          echo "::error::https://fineframe.app/en/download/ does not name $version 10 minutes after the deploy hook"
          exit 1
        env:
          TAG: ${{ github.ref_name }}

  # The tag's GitHub release, once the installers are on R2: notes generated from the pull requests
  # merged since the previous v* tag, after a link to the download page. No installers are attached.
  # A tag that has a release already keeps it.
  github-release:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag has a release already"
            exit 0
          fi
          previous=$(git ls-remote --tags --refs --sort=-v:refname "$GITHUB_SERVER_URL/$GH_REPO" 'v*' |
            sed 's|.*refs/tags/||' | grep -A1 -Fx "$tag" | sed -n 2p)
          args=(--verify-tag --generate-notes --title "$tag"
            --notes "Download the latest Fineframe at https://fineframe.app/en/download/")
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          gh release create "$tag" "${args[@]}"
