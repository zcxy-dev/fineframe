name: desktop

# Builds the desktop app's installers on each system they are for, then runs each built app as
# a person would the first time (apps/desktop/scripts/smoke.ts): it installs the analysis, makes
# an edit of a synthetic clip with stand-ins for Claude and OpenRouter, and quits, leaving nothing
# running. A pull request that changes the app builds and checks them; a tag v<version>
# also uploads them, with copies under names without the version that the website's download page
# links to, their checksums and the update feed, to Cloudflare R2, which downloads.fineframe.app
# serves. Nothing goes to GitHub's releases. Any other branch builds them on request
# (`gh workflow run desktop.yml --ref <branch>`).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/desktop.yml
      - apps/desktop/**
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            installer: dmg
          - name: windows-x64
            runner: windows-latest
            installer: exe
          - name: linux-x64
            runner: ubuntu-latest
            installer: AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A Node download that takes over five minutes gives up and the install runs again from a
      # mirror, as in ci.yml's `platforms` job.
      - id: mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        continue-on-error: true
        env:
          MISE_HTTP_DOWNLOAD_TIMEOUT: 5m
        with:
          cache: false
      - if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_HTTP_DOWNLOAD_TIMEOUT: 10m
          MISE_NODE_MIRROR_URL: https://cdn.npmmirror.com/binaries/node/
        with:
          cache: false
      # The smoke test speaks its clip with the system's voice: `say` on macOS, .NET's speech
      # synthesizer on Windows, espeak-ng here.
      - name: Install espeak-ng
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      # The Supabase project and OAuth client the app signs in with: public values, kept as
      # repository variables. A release cannot be built without them.
      # The macOS app of a tag or a manual run is signed with the Developer ID certificate and
      # notarized with the App Store Connect team key, which only the macOS job gets: on Windows
      # electron-builder would sign with CSC_LINK when WIN_CSC_LINK is unset. A tag's build fails
      # without them, since notarization would otherwise be skipped with only a warning; a manual
      # run without them is signed ad hoc (electron-builder.yml), and electron-builder signs
      # nothing for a pull request.
      - name: Build the installer
        id: build
        env:
          FINEFRAME_SUPABASE_URL: ${{ vars.FINEFRAME_SUPABASE_URL }}
          FINEFRAME_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FINEFRAME_SUPABASE_PUBLISHABLE_KEY }}
          FINEFRAME_OAUTH_CLIENT_ID: ${{ vars.FINEFRAME_OAUTH_CLIENT_ID }}
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ -z "$FINEFRAME_SUPABASE_URL" ] || [ -z "$FINEFRAME_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$FINEFRAME_OAUTH_CLIENT_ID" ]; }; then
            echo "A release needs the FINEFRAME_SUPABASE_URL, FINEFRAME_SUPABASE_PUBLISHABLE_KEY and FINEFRAME_OAUTH_CLIENT_ID repository variables"
            exit 1
          fi
          sign=()
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
              # The Developer ID Application certificate of team 3LN7TBJGRB, with the hardened
              # runtime that notarization requires.
              sign=(-c.mac.identity=3LN7TBJGRB -c.mac.hardenedRuntime=true -c.mac.notarize=true)
              echo "signed=true" >> "$GITHUB_OUTPUT"
            elif [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "A release needs the MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER secrets"
              exit 1
            fi
            # Signing the macOS app (@electron/osx-sign) opens all of its files at once to find
            # the binaries, more than the runner's default limit of open files allows at times
            # (EMFILE).
            ulimit -n "$(sysctl -n kern.maxfilesperproc)"
          fi
          pnpm install --frozen-lockfile
          pnpm --filter @video-editor/desktop dist "${sign[@]}"
      - name: Run the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls apps/desktop/dist/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/app" "$dmg"
          node apps/desktop/scripts/smoke.ts "$RUNNER_TEMP/app/Fineframe.app/Contents/MacOS/Fineframe" \
            --shots "$RUNNER_TEMP/shots"
          hdiutil detach "$RUNNER_TEMP/app"
      # What Gatekeeper checks when a person opens the downloaded app: the Developer ID signature
      # of every file, and the notarization ticket stapled to the app.
      - name: Check the signature and notarization (macOS)
        if: steps.build.outputs.signed == 'true'
        run: |
          dmg=$(ls apps/desktop/dist/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/signed" "$dmg"
          app="$RUNNER_TEMP/signed/Fineframe.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
          hdiutil detach "$RUNNER_TEMP/signed"
      # Installed silently for this user, as the installer does when opened, then run from there.
      - name: Run the built app (Windows)
        if: runner.os == 'Windows'
        run: |
          # Which CPU the runner has: the analysis crashed with an illegal instruction on some (#59).
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
          installer=$(ls apps/desktop/dist/*.exe)
          powershell -NoProfile -Command "Start-Process -Wait -FilePath '$installer' -ArgumentList '/S'"
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs"
          app=$(find "$programs" -maxdepth 3 -name 'Fineframe.exe' | head -1)
          if [ -z "$app" ]; then find "$programs" -maxdepth 3 | head -50; exit 1; fi
          app=$(cygpath -w "$app")
          echo "installed at $app"
          # The installer may open the app when it finishes; a second copy would only hand over to
          # that one and quit, so the smoke test starts from none running.
          sleep 5
          powershell -NoProfile -Command "Get-Process | Where-Object { \$_.Path -eq '$app' } | ForEach-Object { Write-Output \"stopping \$(\$_.Id)\"; Stop-Process -Id \$_.Id -Force }"
          node apps/desktop/scripts/smoke.ts "$app" --shots "$RUNNER_TEMP/shots"
      - name: Run the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1440x960x24" \
            node apps/desktop/scripts/smoke.ts apps/desktop/dist/*.AppImage --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          # The macOS zip too, which the update feed points installed apps at.
          path: |
            apps/desktop/dist/*.${{ matrix.installer }}
            apps/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
      # What electron-updater reads beside the installer: latest*.yml, and the blockmap that
      # lets a later update download only what changed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-${{ matrix.name }}
          path: |
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: feed-*
          path: feed
          merge-multiple: true
      # Signed build provenance for each installer, which `gh attestation verify` checks.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*
      # The tag names the app's version, so the installers' names match the tag.
      - name: Check the tag
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in apps/desktop/package.json"
            exit 1
          fi
      # The installers first, then copies under names without the version (Fineframe-mac-arm64.dmg,
      # Fineframe-win-x64.exe, Fineframe-linux-x86_64.AppImage) and SHA256SUMS of both, then the
      # latest*.yml that point the apps at the installers (apps/desktop/src/updates.ts), with R2's
      # S3 API. What a later release replaces is served with no-cache. The checksums the AWS CLI
      # adds by default are left out, as R2 asks.
      - name: Upload the installers and the update feed to Cloudflare R2
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID variable and the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET secrets are not all set"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          mkdir latest
          for file in installers/*; do
            name=${file#installers/}
            cp "$file" "latest/${name/-$version-/-}"
          done
          sums=$(cd installers && sha256sum -- *; cd ../latest && sha256sum -- *)
          echo "$sums" | tee latest/SHA256SUMS
          r2=(--endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com")
          aws s3 cp installers/ "s3://$R2_BUCKET/" --recursive "${r2[@]}"
          aws s3 cp latest/ "s3://$R2_BUCKET/" --recursive --cache-control no-cache "${r2[@]}"
          aws s3 cp feed/ "s3://$R2_BUCKET/" --recursive --exclude "latest*.yml" "${r2[@]}"
          aws s3 cp feed/ "s3://$R2_BUCKET/" --recursive --exclude "*" --include "latest*.yml" \
            --cache-control no-cache "${r2[@]}"
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # fineframe.app's download page names the version its build read from the update feed
      # (apps/site/lib/release.ts): build it again now that the feed names this one, with the
      # Pages project's deploy hook, which builds main (apps/site/DEPLOY.md).
      - name: Build fineframe.app again
        run: |
          if [ -z "$PAGES_DEPLOY_HOOK" ]; then
            echo "::error::The CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set, so fineframe.app still names the previous version"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$PAGES_DEPLOY_HOOK" > /dev/null
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
