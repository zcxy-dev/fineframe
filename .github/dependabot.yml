# Monthly dependency updates keep review noise low. Minor and patch releases are
# grouped per ecosystem (majors arrive as individual PRs), and a release must be
# seven days old before it is proposed (security updates are not held back). Every PR gets
# only the `dependencies` label, so Dependabot does not create one per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/bench", "/worker"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 ships no tsserver.js, which typescript-language-server needs for code
      # intelligence in editors and agents.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
