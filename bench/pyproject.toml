[project]
name = "vebench"
version = "0.7.0"
description = "Benchmark for automatic video editing: caption accuracy, word timing, shot detection, clicks and A/V drift"
readme = "README.md"
license = "LicenseRef-Proprietary"
keywords = ["benchmark", "asr", "subtitles", "shot-detection", "video-editing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
authors = [
    { name = "Jason Chang" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.7.0",
    "numpy>=2.5.4",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
# Kokoro and its G2P support Python 3.12 at most. The English G2P downloads spaCy's
# `en_core_web_sm` pipeline into the environment the first time it runs.
synth = [
    "huggingface-hub>=2.2.0; python_version < '3.13'",
    "jieba>=0.42.1; python_version < '3.13'",
    "kokoro>=0.9.4; python_version < '3.13'",
    "misaki[zh]>=0.9.4; python_version < '3.13'",
    "opencc>=1.4.2; python_version < '3.13'",
    "pillow>=12.3.0; python_version < '3.13'",
    "torch>=2.14.1; python_version < '3.13'",
]

[project.urls]
Repository = "https://github.com/zcxy-dev/fineframe"
Issues = "https://github.com/zcxy-dev/fineframe/issues"

[project.scripts]
vebench = "vebench.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# The synthetic corpus runs on a CPU; a CUDA build of torch would only add gigabytes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Each test's tmp_path is removed when the run ends, failed or not.
tmp_path_retention_policy = "none"
testpaths = ["tests"]
markers = ["synth: needs the synth extra and downloads the speech model"]

[tool.basedpyright]
typeCheckingMode = "basic"
# CI leaves out the `synth` extra, so its packages cannot be found there: a missing import is a
# warning. With `uv sync --extra synth`, the code that uses them is checked against their types.
reportMissingImports = "warning"
